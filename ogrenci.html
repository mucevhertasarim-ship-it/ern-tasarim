<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERN Tasarım - Canlı Akademiye Bağlanılıyor...</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #05070c;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
            padding: 20px;
        }
        .box {
            max-width: 440px;
            width: 100%;
            padding: 36px 24px;
            background: rgba(15, 23, 42, 0.88);
            border: 1.5px solid rgba(212, 175, 55, 0.35);
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.7);
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { font-size: 1.3rem; margin: 0 0 10px 0; color: #f8fafc; font-weight: 800; }
        p { font-size: 0.92rem; color: #94a3b8; line-height: 1.55; margin: 0 0 20px 0; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            text-decoration: none;
            padding: 13px 26px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 20px rgba(16,185,129,0.35);
        }
        .btn-wa {
            background: #25D366;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner" id="spinner"></div>
        <h2 id="title">Canlı Derse Bağlanılıyor...</h2>
        <p id="desc">Eğitmen stüdyosuna güvenli internet köprüsü kuruluyor, lütfen bekleyiniz.</p>
        <div id="actionArea" style="display:none;">
            <button onclick="window.location.reload()" class="btn"><i class="fa-solid fa-rotate-right"></i> Tekrar Bağlan</button>
            <div style="margin-top: 14px;">
                <a href="https://wa.me/905453699990?text=Hocam%20derse%20baglanamiyorum" target="_blank" class="btn btn-wa"><i class="fa-brands fa-whatsapp"></i> WhatsApp Destek</a>
            </div>
        </div>
    </div>
    <script>
        async function connect() {
            try {
                // 1. live_bridge.json kontrol et
                const res = await fetch('/live_bridge.json?t=' + Date.now(), { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.stream_url && data.status === 'online') {
                        window.location.replace(data.stream_url);
                        return;
                    }
                }
            } catch(e) {}

            // Bulunamadıysa
            setTimeout(() => {
                const sp = document.getElementById('spinner');
                if (sp) sp.style.display = 'none';
                document.getElementById('title').textContent = 'Canlı Yayın Bekleniyor';
                document.getElementById('desc').textContent = 'Eğitmen stüdyodan dersi henüz başlatmadı veya ders istirahat arasında. Lütfen stüdyo açıldığında tekrar deneyiniz.';
                document.getElementById('actionArea').style.display = 'block';
            }, 1200);
        }
        connect();
    </script>
</body>
</html>
